# Ta boutique. Chaque enregistrement de ton code la recharge : elle est en ligne aussitôt.
quarkus.http.port=8080
quarkus.console.enabled=false
quarkus.analytics.disabled=true
quarkus.log.level=WARN
# La base est un fichier : elle survit aux enregistrements et aux redémarrages.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./donnees/boutique
quarkus.hibernate-orm.schema-management.strategy=update
